# Phase 4 Sample Complexity Sweep Configuration
experiment:
  name: "dcp_sample_complexity"
  description: "Phase 4 sweep to investigate recovery success vs sample count (m) and truncation (k) for moduli N in {4, 8, 16}"

base_parameters:
  epsilon: 0.0
  shots: 500
  seed: 42
  problem_type: "dcp"
  recovery_strategy: "bayesian"
  truncation_mode: "msb"
  backend: "statevector"

sweep_grid:
  - N: 4
    s: 3
    k_values: [1, 2]
    m_values: [1, 2, 4, 8, 16]
  - N: 8
    s: 5
    k_values: [1, 2, 3]
    m_values: [1, 2, 4, 8, 16]
  - N: 16
    s: 11
    k_values: [1, 2, 3, 4]
    m_values: [1, 2, 4, 8, 16]

output:
  dir: "results/raw/dcp_sample_complexity"
  file_prefix: "dcp_sample_complexity_sweep"
  format: "parquet"
