# Phase 6.3 — DCP vs EDCP Comparison Sweep Configuration
experiment:
  name: "edcp_comparison"
  description: "Phase 6.3 sweep: Compare DCP and EDCP recovery probabilities"

base_parameters:
  m: 1
  shots: 300
  seed: 42
  problem_type: "edcp" # Run as EDCP engine
  recovery_strategy: "bayesian"
  truncation_mode: "msb"
  backend: "statevector"
  edcp_chi:
    # lwe-like
    0: 0.3535533905932738  # sqrt(1/8)
    1: 0.6123724356957945  # sqrt(3/8)
    2: 0.6123724356957945  # sqrt(3/8)
    3: 0.3535533905932738  # sqrt(1/8)

sweep_grid:
  - N: 16
    s: 11
    k_values: [1, 2, 3, 4]
    epsilon_values: [0.0]
  - N: 32
    s: 19
    k_values: [1, 2, 3, 4, 5]
    epsilon_values: [0.0]

output:
  dir: "results/raw/edcp_comparison"
  file_prefix: "edcp_sweep"
  format: "parquet"
